<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gerenciador de Tarefas</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="cabecalho">
    <h1>Gerenciador de Tarefas</h1>
    <p>Registre quem faz o quê e até quando.</p>
  </header>

  <main class="conteudo-principal">

    <!-- Formulário para cadastrar uma tarefa -->
    <section class="nova-tarefa">
      <h2>Nova tarefa</h2>

      <form id="form-tarefa">
        <div class="campo">
          <label for="titulo">Título (obrigatório)</label>
          <input
            type="text"
            id="titulo"
            name="titulo"
            required
          >
        </div>

        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            rows="4"
          ></textarea>
        </div>

        <div class="campo">
          <label for="responsavel">Responsável (obrigatório)</label>
          <input
            type="text"
            id="responsavel"
            name="responsavel"
            required
          >
        </div>

        <div class="campo">
          <label for="prazo">Prazo</label>
          <input type="date" id="prazo" name="prazo">
        </div>

        <button type="submit">Adicionar tarefa</button>
      </form>
    </section>

    <!-- Filtros e tarefas -->
    <section class="tarefas">
      <h2>Tarefas</h2>

      <div class="filtros">
        <div class="campo">
          <label for="filtro-status">Status</label>

          <select id="filtro-status" name="filtro-status">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="em-andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>

        <div class="campo">
          <label for="filtro-responsavel">Responsável</label>
          <input
            type="search"
            id="filtro-responsavel"
            placeholder="Digite o nome do responsável"
          >
        </div>
      </div>

      <p aria-live="polite">Mostrando 0 de 0 tarefas</p>

      <!-- O JavaScript cria os cartões dentro desta lista -->
      <ul id="lista-tarefas" class="lista-tarefas"></ul>
    </section>

  </main>
</body>

</html>
